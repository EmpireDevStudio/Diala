<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F7F6F0">
  <title>FlipDialler — Living Paper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    
    <!-- MASTHEAD -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-crest">FD</span>
        <span class="brand-title">FlipDialler <em>Lite</em></span>
      </div>
      <div class="header-actions">
        <label for="csvFileInput" class="btn btn-subtle" title="Import CSV">📥 Import</label>
        <input type="file" id="csvFileInput" accept=".csv,text/csv" hidden>
        <button id="btnExportCsv" class="btn btn-subtle" title="Export CSV">📤 Export</button>
        <button id="btnNewLead" class="btn btn-gold">+ Lead</button>
      </div>
    </header>

    <!-- WORKBENCH WRAPPER -->
    <main class="workbench">
      
      <!-- PANE 1: LIST & SEARCH -->
      <section class="pane pane-list" id="paneList">
        <div class="filter-strip">
          <button class="filter-btn active" data-stage="fresh">Fresh (<span id="countFresh">0</span>)</button>
          <button class="filter-btn" data-stage="callback">Due (<span id="countCallback">0</span>)</button>
          <button class="filter-btn" data-stage="contacted">Spoken (<span id="countContacted">0</span>)</button>
          <button class="filter-btn" data-stage="all">All</button>
        </div>

        <div class="search-box">
          <input type="search" id="inputSearch" placeholder="Search company, name, phone... (Press '/')">
        </div>

        <div class="contact-list" id="contactList" role="list"></div>
      </section>

      <!-- PANE 2: ACTIVE LEAD COCKPIT -->
      <section class="pane pane-cockpit" id="paneCockpit">
        
        <div id="cockpitEmpty" class="cockpit-empty">
          <p>Select a contact or import a CSV to begin dialing.</p>
        </div>

        <div id="cockpitContent" class="cockpit-content hidden">
          <div class="cockpit-nav-mobile">
            <button id="btnBackToList" class="btn btn-subtle">‹ Back to Pipeline</button>
          </div>

          <!-- Contact Header -->
          <div class="lead-card">
            <div class="lead-header">
              <div class="lead-titles">
                <h2 id="leadCompany">Company Name</h2>
                <div class="lead-subtitle" id="leadSubtitle">Contact Name • Job Title</div>
              </div>
              <button id="btnEditLead" class="btn-text">Edit</button>
            </div>

            <!-- Big Call Button -->
            <a id="btnCallLead" href="#" class="btn-call-trigger">
              <span class="call-icon">📞</span>
              <div class="call-meta">
                <span class="call-action-text">CALL DIRECT LINE</span>
                <span class="call-phone-number" id="leadPhone">—</span>
              </div>
            </a>
          </div>

          <!-- Instant Macro Dispositions -->
          <div class="disposition-bar">
            <button class="disp-btn btn-na" id="btnDispNA">
              <strong>No Answer</strong>
              <small>Log attempt (N)</small>
            </button>
            <button class="disp-btn btn-cb" id="btnDispCB">
              <strong>Call Back</strong>
              <small>Schedule reminder</small>
            </button>
            <button class="disp-btn btn-sp" id="btnDispSpoken">
              <strong>Spoken</strong>
              <small>Mark contacted (D)</small>
            </button>
            <button class="disp-btn btn-dnc" id="btnDispDNC">
              <strong>Delete</strong>
              <small>Remove lead</small>
            </button>
          </div>

          <!-- Scratchpad & Notes -->
          <div class="card notes-card">
            <div class="notes-header">
              <label for="leadNotes">CALL SCRATCHPAD & NOTES</label>
              <span id="notesSaveIndicator" class="save-indicator">Saved</span>
            </div>
            <textarea id="leadNotes" rows="6" placeholder="Type call notes here (auto-saves)..."></textarea>
          </div>

          <!-- Email Trigger -->
          <div class="email-row" id="leadEmailRow">
            <span>Email: <strong id="leadEmail">None</strong></span>
            <a id="btnEmailLead" href="#" class="btn btn-subtle">Send Email</a>
          </div>
        </div>

      </section>

    </main>
  </div>

  <!-- MODAL: ADD / EDIT CONTACT -->
  <dialog id="dialogLeadForm" class="modal-dialog">
    <form id="leadForm" method="dialog">
      <h3 id="formTitle">Add New Lead</h3>
      <input type="hidden" id="formId">

      <div class="form-group">
        <label for="formCompany">Company / Business Name *</label>
        <input type="text" id="formCompany" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="formName">Contact Name</label>
          <input type="text" id="formName">
        </div>
        <div class="form-group">
          <label for="formTitleField">Job Title</label>
          <input type="text" id="formTitleField">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="formPhone">Phone Number</label>
          <input type="tel" id="formPhone">
        </div>
        <div class="form-group">
          <label for="formEmail">Email Address</label>
          <input type="email" id="formEmail">
        </div>
      </div>

      <div class="form-actions">
        <button type="button" id="btnCancelForm" class="btn btn-subtle">Cancel</button>
        <button type="submit" class="btn btn-gold">Save Contact</button>
      </div>
    </form>
  </dialog>

  <!-- MODAL: QUICK CALLBACK PICKER -->
  <dialog id="dialogCallback" class="modal-dialog">
    <div class="callback-content">
      <h3>Schedule Call Back</h3>
      <div class="callback-pills">
        <button class="btn btn-subtle" data-cb-hours="2">+2 Hours</button>
        <button class="btn btn-subtle" data-cb-hours="4">+4 Hours</button>
        <button class="btn btn-subtle" data-cb-hours="24">Tomorrow</button>
        <button class="btn btn-subtle" data-cb-hours="48">In 2 Days</button>
      </div>
      <div class="form-group" style="margin-top: 14px;">
        <label for="inputCustomCallback">Custom Date / Time:</label>
        <input type="datetime-local" id="inputCustomCallback">
      </div>
      <div class="form-actions" style="margin-top: 14px;">
        <button id="btnCancelCallback" class="btn btn-subtle">Close</button>
        <button id="btnConfirmCustomCallback" class="btn btn-gold">Set Time</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
